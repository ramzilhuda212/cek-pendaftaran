<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Utama & Control Center - KEMBARANAS III 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- NAVBAR UTAMA -->
  <header class="bg-amber-950 text-white sticky top-0 z-40 border-b-2 border-amber-500 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-400 flex items-center justify-center text-amber-300 text-xl">
          <i class="fa-solid fa-compass"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-lg text-amber-100">KEMBARANAS III</span>
            <span id="roleBadge" class="bg-amber-500 text-amber-950 text-[10px] font-black px-2 py-0.5 rounded-full uppercase">PESERTA</span>
          </div>
          <p class="text-[11px] text-amber-200/80 font-medium">Perkemahan Ukhuwah SAKO SIT Indonesia 2026</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="switchTab('userTab')" class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-amber-950 shadow">
          <i class="fa-solid fa-magnifying-glass"></i> Cek Pendaftaran
        </button>
        <button onclick="openLoginModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-amber-200 hover:text-white bg-amber-900/60 border border-amber-700">
          <i class="fa-solid fa-user-shield"></i> Portal Admin
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6 flex-1 w-full">
    <!-- BROADCAST BANNER -->
    <div id="userBroadcastBanner" class="bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 border-2 border-amber-600 text-amber-950 p-4 rounded-2xl shadow-md flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-950 text-amber-300 flex items-center justify-center text-lg font-bold flex-shrink-0 animate-bounce">
          <i class="fa-solid fa-bullhorn"></i>
        </div>
        <div>
          <span class="text-[10px] font-black uppercase bg-amber-950 text-amber-300 px-2 py-0.5 rounded-full">PENGUMUMAN PANITIA</span>
          <p id="userBroadcastText" class="text-xs sm:text-sm font-extrabold mt-0.5">Memuat pengumuman resmi...</p>
        </div>
      </div>
    </div>

    <!-- TAB 1: PENCARIAN PESERTA -->
    <section id="userTab" class="space-y-6">
      <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-lg border border-amber-100 max-w-2xl mx-auto text-center space-y-4">
        <h2 class="text-xl font-extrabold text-amber-950">Pencarian Data Pendaftar</h2>
        <form onsubmit="handleSearch(event)" class="space-y-3">
          <input type="text" id="searchKeyword" required placeholder="Ketik Nama, No ID, atau Sekolah..." class="w-full p-3.5 bg-slate-50 border border-amber-300 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-amber-500">
          <button type="submit" id="btnCari" class="w-full bg-amber-900 hover:bg-amber-950 text-white font-bold py-3.5 rounded-2xl text-sm shadow">
            <i class="fa-solid fa-magnifying-glass"></i> Cari Data Pendaftar
          </button>
        </form>
      </div>
      <div id="searchResult" class="hidden space-y-4 max-w-3xl mx-auto"></div>
    </section>

    <!-- TAB 2: PORTAL ADMIN -->
    <section id="adminTab" class="hidden flex flex-col lg:flex-row gap-6 items-start">
      <aside class="w-full lg:w-64 bg-white p-4 rounded-3xl border border-amber-200 shadow-md space-y-3">
        <div class="px-3 py-2 border-b">
          <h4 id="sidebarUserName" class="font-extrabold text-amber-950 text-sm">Admin Posko</h4>
          <span id="sidebarUserRole" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full uppercase">ADMIN</span>
        </div>
        <nav class="space-y-1 text-xs font-bold">
          <button onclick="switchAdminPanel('panelOverview')" class="w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-2 bg-amber-900 text-white">
            <i class="fa-solid fa-chart-pie"></i> Ringkasan Stat
          </button>
          <button onclick="switchAdminPanel('panelDataTable')" class="w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-2 text-slate-700 hover:bg-amber-50">
            <i class="fa-solid fa-table-list"></i> Kelola Pendaftar
          </button>
          <div id="superadminMenu" class="hidden space-y-1 pt-2 border-t">
            <button onclick="switchAdminPanel('panelUsers')" class="w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-2 text-purple-900 bg-purple-50">
              <i class="fa-solid fa-users-gear"></i> Manajemen Akun
            </button>
            <button onclick="switchAdminPanel('panelSettings')" class="w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-2 text-blue-900 bg-blue-50">
              <i class="fa-solid fa-sliders"></i> Pengaturan Master
            </button>
            <button onclick="switchAdminPanel('panelLogs')" class="w-full px-3.5 py-2.5 rounded-2xl flex items-center gap-2 text-rose-900 bg-rose-50">
              <i class="fa-solid fa-shield-halved"></i> Audit Logs
            </button>
          </div>
        </nav>
        <button onclick="logoutAdmin()" class="w-full px-3.5 py-2 rounded-2xl text-xs font-bold text-red-600 bg-red-50 border border-red-200 mt-4">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </aside>

      <div class="flex-1 w-full space-y-6">
        <div id="panelOverview" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white p-5 rounded-3xl border shadow-sm">
            <p class="text-xs text-gray-500 font-bold uppercase">Total Terdaftar</p>
            <h3 id="statTotal" class="text-2xl font-black text-amber-950">0</h3>
          </div>
        </div>

        <div id="panelUsers" class="hidden bg-white p-6 rounded-3xl border shadow-md space-y-4">
          <h3 class="font-extrabold text-amber-950 text-base border-b pb-3"><i class="fa-solid fa-users-gear text-purple-700"></i> Kelola Hak Akses Admin</h3>
          <div class="overflow-x-auto"><table class="w-full text-xs text-left"><tbody id="tableUsersBody"></tbody></table></div>
        </div>

        <div id="panelSettings" class="hidden bg-white p-6 rounded-3xl border shadow-md space-y-4">
          <h3 class="font-extrabold text-amber-950 text-base border-b pb-3"><i class="fa-solid fa-sliders text-blue-700"></i> Pengaturan Master</h3>
          <form onsubmit="handleSaveSettings(event)" class="space-y-3 text-xs">
            <textarea id="setBroadcast" rows="3" class="w-full p-3 border rounded-xl bg-slate-50 font-semibold"></textarea>
            <button type="submit" class="bg-blue-800 text-white px-5 py-2.5 rounded-xl font-bold shadow">Simpan</button>
          </form>
        </div>

        <div id="panelLogs" class="hidden bg-white p-6 rounded-3xl border shadow-md space-y-4">
          <h3 class="font-extrabold text-amber-950 text-base border-b pb-3"><i class="fa-solid fa-shield-halved text-rose-700"></i> Audit Logs</h3>
          <div class="overflow-x-auto max-h-96"><table class="w-full text-xs text-left"><tbody id="tableLogsBody" class="font-mono text-[11px]"></tbody></table></div>
        </div>

        <div id="panelDataTable" class="hidden bg-white p-6 rounded-3xl border shadow-md space-y-4">
          <h3 class="font-extrabold text-amber-950 text-base border-b pb-3">Kelola Data Pendaftar</h3>
          <div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead id="tableAdminHeader" class="bg-amber-100"></thead><tbody id="tableAdminBody"></tbody></table></div>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL LOGIN ADMIN -->
  <div id="modalLogin" class="fixed inset-0 bg-slate-900/70 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-3xl max-w-md w-full relative shadow-2xl border space-y-4">
      <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="text-lg font-black text-amber-950 text-center">Autentikasi Admin</h3>
      <form onsubmit="handleAdminLogin(event)" class="space-y-3 text-xs font-bold">
        <input type="text" id="adminUser" required placeholder="Username" class="w-full p-3 border rounded-xl bg-slate-50">
        <input type="password" id="adminPass" required placeholder="Password" class="w-full p-3 border rounded-xl bg-slate-50">
        <button type="submit" id="btnLogin" class="w-full bg-amber-900 text-white py-3 rounded-xl shadow">Masuk Dashboard</button>
      </form>
    </div>
  </div>

  <script>
    // Otomatis mengenali URL eksekusi Google Apps Script saat diakses langsung
    const SCRIPT_URL = (window.location.href.indexOf('script.google.com') !== -1)
      ? window.location.href
      : "https://script.google.com/macros/s/AKfycbznFj-ndl5ArO7N5lnwy7EYnChwbV8slndN0EWlOZ5lXEYauoInw6WZHfFwgN1O7TEV/exec";

    let currentUser = { username: '', nama: 'Guest', role: 'guest' };
    let rawHeaders = [];
    let rawAdminRows = [];

    function switchTab(tab) {
      document.getElementById('userTab').classList.toggle('hidden', tab !== 'userTab');
      document.getElementById('adminTab').classList.toggle('hidden', tab !== 'adminTab');
    }

    function openLoginModal() {
      if (currentUser.role !== 'guest') switchTab('adminTab');
      else document.getElementById('modalLogin').classList.remove('hidden');
    }

    function closeLoginModal() { document.getElementById('modalLogin').classList.add('hidden'); }

    async function handleSearch(e) {
      e.preventDefault();
      const kw = document.getElementById('searchKeyword').value;
      const resBox = document.getElementById('searchResult');

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'search', keyword: kw })
        }).then(r => r.json());

        resBox.innerHTML = '';
        resBox.classList.remove('hidden');

        if (res.success && res.data.length > 0) {
          res.data.forEach(item => {
            resBox.innerHTML += `
              <div class="bg-white p-5 rounded-3xl shadow border space-y-2">
                <h3 class="font-bold text-amber-950 uppercase">${item.nama}</h3>
                <p class="text-xs text-gray-500">${item.statusPendaftaran} - ${item.asalSekolah}</p>
              </div>`;
          });
        } else {
          resBox.innerHTML = `<div class="bg-white p-5 rounded-3xl text-center text-red-600 text-xs font-bold">Data tidak ditemukan.</div>`;
        }
      } catch (err) {
        alert("Gagal koneksi: " + err.message);
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: u, password: p })
        }).then(r => r.json());

        if (res.success) {
          currentUser = res.user;
          updateRoleUI();
          closeLoginModal();
          switchTab('adminTab');
          loadAdminData();
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal koneksi: " + err.message);
      }
    }

    function updateRoleUI() {
      document.getElementById('roleBadge').innerText = currentUser.role.toUpperCase();
      document.getElementById('sidebarUserName').innerText = currentUser.nama;
      document.getElementById('sidebarUserRole').innerText = currentUser.role.toUpperCase();

      if (currentUser.role === 'superadmin') {
        document.getElementById('superadminMenu').classList.remove('hidden');
      } else {
        document.getElementById('superadminMenu').classList.add('hidden');
      }
    }

    async function loadAdminData() {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getAdminData', role: currentUser.role })
      }).then(r => r.json());

      if (res.success) {
        rawHeaders = res.headers;
        rawAdminRows = res.rows;

        document.getElementById('statTotal').innerText = rawAdminRows.length;
        document.getElementById('userBroadcastText').innerText = res.settings.broadcast_text || '-';
        document.getElementById('setBroadcast').value = res.settings.broadcast_text || '';

        renderAdminTable();
        if (currentUser.role === 'superadmin') {
          renderAuditLogs(res.logs);
        }
      }
    }

    function switchAdminPanel(panelId) {
      ['panelOverview', 'panelUsers', 'panelSettings', 'panelLogs', 'panelDataTable'].forEach(p => {
        const el = document.getElementById(p);
        if (el) el.classList.add('hidden');
      });
      document.getElementById(panelId).classList.remove('hidden');
    }

    function renderAdminTable() {
      const thead = document.getElementById('tableAdminHeader');
      thead.innerHTML = rawHeaders.map(h => `<th class="p-3">${h}</th>`).join('') + `<th class="p-3 text-center">Aksi</th>`;

      const tbody = document.getElementById('tableAdminBody');
      tbody.innerHTML = rawAdminRows.map(row => `
        <tr class="hover:bg-slate-50">
          ${row.map(c => `<td class="p-3 border-b">${c}</td>`).join('')}
          <td class="p-3 border-b text-center">
            ${currentUser.role === 'superadmin' ? `<button onclick="deleteData('${row[0]}')" class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold"><i class="fa-solid fa-trash"></i> Hapus</button>` : `<span class="text-gray-400 text-[10px]">Terbatas</span>`}
          </td>
        </tr>
      `).join('');
    }

    function renderAuditLogs(logs) {
      const tbody = document.getElementById('tableLogsBody');
      tbody.innerHTML = logs.map(l => `
        <tr>
          <td class="p-2 border-b">${new Date(l[0]).toLocaleString('id-ID')}</td>
          <td class="p-2 border-b font-bold">${l[1]}</td>
          <td class="p-2 border-b">${l[2]}</td>
          <td class="p-2 border-b text-blue-700 font-bold">${l[3]}</td>
          <td class="p-2 border-b">${l[4]}</td>
        </tr>
      `).join('');
    }

    async function handleSaveSettings(e) {
      e.preventDefault();
      const text = document.getElementById('setBroadcast').value;

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'saveSettings', authUser: currentUser.username, authRole: currentUser.role,
          settings: { broadcast_text: text }
        })
      }).then(r => r.json());

      alert(res.message);
      if (res.success) loadAdminData();
    }

    async function deleteData(id) {
      if (!confirm(`Hapus data ${id}?`)) return;
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteData', id: id, authUser: currentUser.username, authRole: currentUser.role })
      }).then(r => r.json());
      alert(res.message);
      if (res.success) loadAdminData();
    }

    function logoutAdmin() {
      currentUser = { username: '', nama: 'Guest', role: 'guest' };
      updateRoleUI();
      switchTab('userTab');
    }
  </script>
</body>
</html>
